[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper-runtime"
version = "0.1.0"
description = "LangGraph runtime that orchestrates markdown-defined agents across projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
gatekeeper-runtime = "gatekeeper_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
